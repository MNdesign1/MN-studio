<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M&amp;N Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Allura&family=Playfair+Display:wght@500;700&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&family=Cairo:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#fff;--tx:#1d2330;--mut:#6b7280;--gr:#5bc085;--pur:#7c4dcc;--chip:#f2f3f5;--ui:'Plus Jakarta Sans','Cairo',sans-serif;--serif:'Cormorant Garamond','Amiri',serif;--script:'Allura','Aref Ruqaa',cursive;--disp:'Playfair Display','Amiri',serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161c;--tx:#eef0f5;--mut:#9aa1b0;--chip:#232733}}
:root[data-theme=dark]{--bg:#14161c;--tx:#eef0f5;--mut:#9aa1b0;--chip:#232733}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--ui);overflow-x:hidden}
button,input{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.lg{display:flex;align-items:center;gap:8px;cursor:pointer;font:600 19px var(--ui)}.lg img{height:40px;background:#fff;border-radius:10px;padding:4px}
.hr{display:flex;gap:8px}.ib{min-width:42px;height:42px;border-radius:50%;border:0;background:var(--chip);cursor:pointer;font-size:18px;display:grid;place-items:center}.lb{padding:0 14px;font-weight:600;font-size:14px;border-radius:30px}
main{max-width:980px;margin:0 auto;padding:0 18px 60px}
.bk{border:0;background:var(--chip);border-radius:30px;padding:8px 16px;cursor:pointer;font-weight:600;margin-top:6px}
.bc{display:flex;flex-wrap:wrap;gap:6px;color:var(--mut);margin:12px 0 18px}.bc a{cursor:pointer}.bc b{color:var(--tx);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:40px;background:var(--gr);color:#fff;font-weight:600;font-size:18px;padding:14px;cursor:pointer;text-align:center;transition:.2s}.btn:hover{filter:brightness(.95);transform:translateY(-1px)}.btn.o{background:transparent;color:var(--tx);border:2px solid var(--chip)}
.two{display:grid;gap:10px;margin-top:10px}@media(min-width:560px){.two.b{grid-template-columns:1fr 1fr}}
.hero{text-align:center;padding:26px 0 6px}.hero h1{font:400 clamp(34px,8vw,62px)/1.1 var(--serif);margin:0 0 10px}.hero p{color:var(--mut);max-width:540px;margin:0 auto 20px}.hero .btn{max-width:300px;margin:auto}
h2{font:600 22px var(--ui);margin:28px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.tile{cursor:pointer}.tile .st{border-radius:18px;padding:14px;transition:.25s;overflow:hidden}.tile:hover .st{transform:translateY(-4px)}.tile p{margin:8px 2px 0;font-weight:600}.tile small{color:var(--mut)}
.cat .st{display:grid;place-items:center;height:190px}.cat .st>*{width:62%}.cat .cs,.tile .cs{width:100%}
.srch{width:100%;padding:13px 18px;border-radius:30px;border:2px solid var(--chip);background:var(--bg);margin-bottom:14px}
.stage{border-radius:28px;padding:20px 18px 30px;max-width:540px;margin:0 auto;text-align:center}
.acts{display:flex;gap:10px;justify-content:center;margin-bottom:22px}.acts button{border:0;background:#fffc;color:#222;border-radius:30px;padding:9px 18px;cursor:pointer;font-weight:600}
.cs{display:grid;gap:16px;margin:0 auto}.stage .cs.iv{width:68%;position:relative}.stage .cs.iv:before{content:"";position:absolute;left:-14%;right:16%;top:7%;bottom:-5%;background:#fff;box-shadow:0 6px 18px #0002}.stage .cs.iv .card{z-index:1;position:relative}.stage .cs.bz2{width:90%}.cs .bzw{filter:drop-shadow(0 8px 14px #0003)}
.sw{display:flex;gap:12px;margin:10px 0 18px}.sw i{width:38px;height:38px;border-radius:50%;border:2px solid var(--chip);cursor:pointer}.sw i.on{outline:2px solid var(--tx);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
.pm{border:1.5px solid var(--pur);color:var(--pur);border-radius:12px;padding:6px 14px;font-weight:600}.pm.f{border-color:var(--gr);color:var(--gr)}
.cu{display:grid;gap:24px}@media(min-width:760px){.cu{grid-template-columns:1fr 1fr;align-items:start}}
.fm label{display:block;margin:12px 0 4px;font-weight:600}.fm input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--chip);background:var(--bg)}
/* palettes */
.k-bouquet{--fl:#a58fd6;--fl2:#f2b5a7;--gold:#b0825a;--ink:#2e2a36;--env:#e6d6ef;--flap:#d9c4e6;--pk:#efe2f5}
.k-blooms{--fl:#8fb0d8;--fl2:#e4ecf7;--gold:#b8934a;--ink:#3a4a66;--env:#c4d6ee;--flap:#b3c9e6;--pk:#d4e2f4}
.k-couple{--fl:#e58a9a;--fl2:#f9ccd2;--gold:#b8863f;--ink:#5a2f3a;--env:#f4cfd4;--flap:#eebcc4;--pk:#f8dde0}
.k-neon{--env:#3b1b78;--flap:#2c1360;--pk:#4a2490;--ink:#fff;--gold:#ff3d9a}.k-confetti{--env:#ffd9a0;--flap:#ffc67a;--pk:#ffe4b8;--ink:#3b2a4a;--gold:#ff6b8b}
.k-modern,.k-classic,.k-pro,.k-trattoria,.k-grill,.k-cafe{--env:#ddd;--flap:#ccc;--pk:#eee}
/* cards */
.card{container-type:inline-size;aspect-ratio:5/7;width:100%;position:relative;background:var(--paper,#faf6f1);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:9cqw;box-shadow:0 10px 30px #0002;font-family:var(--serif)}
.card>*{position:relative;z-index:2;margin:0}
.pre{font-size:4.2cqw;line-height:1.35;max-width:64cqw}.sc{font:6.5cqw/1.3 var(--script);color:var(--gold)}
.nm{font-size:10cqw;line-height:1.1;letter-spacing:.06em;text-transform:uppercase;margin:1.5cqw 0!important}
.card.w{padding:7cqw 9cqw 19cqw}.k-couple .nm{font:11cqw/1.1 var(--script);text-transform:none;letter-spacing:0}.k-blooms .nm{color:var(--gold);font-size:9.5cqw}
.card.k-blooms{padding-inline-start:28cqw}
.dt{font-size:4cqw;line-height:1.4;margin-top:3cqw!important}
.cpl{width:34cqw;overflow:visible}
.sp{position:absolute;z-index:1!important;width:34cqw;height:56cqw;pointer-events:none;animation:sway 4s ease-in-out infinite}.sp svg{width:100%;height:100%;overflow:visible}
.p-tl{top:-3cqw;left:-3cqw;transform-origin:0 0}.p-tr{top:-3cqw;right:-3cqw;scale:-1 1;transform-origin:100% 0;animation-delay:-1s}
.p-bl{bottom:-3cqw;left:-3cqw;scale:1 -1;transform-origin:0 100%;animation-delay:-2s}.p-br{bottom:-3cqw;right:-3cqw;rotate:180deg;transform-origin:100% 100%;animation-delay:-3s}
.p-ml{top:42cqw;left:-8cqw;rotate:-70deg;width:40cqw;height:64cqw}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 1.6s ease-in-out infinite}.bride{animation-delay:.35s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.fh{animation:up 3s infinite;opacity:0}.fh:nth-of-type(2){animation-delay:1s}.fh:nth-of-type(3){animation-delay:2s}
@keyframes up{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.qb{position:absolute;z-index:3;left:50%;bottom:5cqw;translate:-50% 0;text-align:center;font:2.6cqw/1.2 var(--ui);display:flex;flex-direction:column;align-items:center;gap:1cqw;color:inherit}
.qr{display:block;width:15cqw;height:15cqw;background:#fff;border-radius:1.2cqw;box-shadow:0 1px 4px #0003}.qr svg{width:100%;height:100%;display:block}
/* party */
.pn{background:radial-gradient(circle at 50% 0,#3b1b78,#120a2c 72%);color:#fff;font-family:var(--ui);padding:34cqw 8cqw 19cqw;justify-content:flex-start;gap:2cqw}
.pn .pre{font-size:3.4cqw;letter-spacing:.3em;text-transform:uppercase;color:#cdb8ff}.pn .nm{font:800 12cqw/1 var(--ui);letter-spacing:0;text-transform:none;text-shadow:0 0 2cqw var(--c),0 0 6cqw var(--c)}
.pn .sc{color:var(--c);font-size:10cqw;text-shadow:0 0 3cqw var(--c)}.pn .dt{font-size:4cqw;color:#e6dcff}
.ball{position:absolute;top:0;left:50%;width:30cqw;translate:-50% 0;transform-origin:50% 0;animation:swing 3s ease-in-out infinite;z-index:1}@keyframes swing{50%{transform:rotate(7deg)}0%,100%{transform:rotate(-7deg)}}
.tw{animation:tw 1.6s infinite}@keyframes tw{50%{opacity:.1}}
.cf{position:absolute;width:2cqw;height:1cqw;animation:cfd 3s ease-in-out infinite alternate;z-index:1}@keyframes cfd{to{transform:translateY(5cqw) rotate(160deg)}}
.pc{background:#fff6df;color:#3b2a4a;font-family:var(--ui);padding:44cqw 8cqw 19cqw;justify-content:flex-start;gap:2cqw}
.pc .pre{font:800 4cqw var(--ui)}.pc .nm{font:800 11cqw/1.05 var(--ui);letter-spacing:0;text-transform:none;color:var(--c)}.pc .sc{font:600 8cqw var(--script);color:#3b2a4a}.pc .dt{font-size:4cqw}
.bls{position:absolute;top:2cqw;left:0;right:0;height:42cqw;z-index:1}.bls svg{width:100%;height:100%}.bl{animation:fl 4s ease-in-out infinite}.bl:nth-child(2){animation-delay:-1.3s}.bl:nth-child(3){animation-delay:-2.6s}@keyframes fl{50%{transform:translateY(-4px)}}
/* business cards */
.bz{aspect-ratio:7/4;padding:0;border-radius:1.4cqw;display:block;text-align:start;font-family:var(--ui)}
.bz .a{position:absolute}.bz img{filter:invert(1)}
.bm{background:#131417;color:#fff}.bm:before{content:"";position:absolute;inset:0 0 0 auto;width:38%;background:var(--c);clip-path:polygon(40% 0,100% 0,100% 100%,0 100%)}
.bm .nmz{left:7cqw;bottom:17cqw;font:600 6cqw var(--ui);letter-spacing:.12em;text-transform:uppercase}.bm .tlz{left:7cqw;bottom:10cqw;font-size:3.2cqw;color:var(--c);letter-spacing:.08em}.bm .coz{right:6cqw;bottom:7cqw;color:#131417;font-weight:800;font-size:3.2cqw}
.bmb{background:#f4f3ef;color:#131417}.bmb ul{list-style:none;margin:0;padding:0;left:8cqw;top:50%;translate:0 -50%;display:grid;gap:2.4cqw;font-size:3.4cqw}.bmb li:before{content:"";display:inline-block;width:1.6cqw;height:1.6cqw;background:var(--c);border-radius:50%;margin-inline-end:2cqw}.bmb .qr{inset-inline-end:8cqw;top:50%;translate:0 -50%;width:30cqw;height:30cqw}
.bc1{background:#f7f0e1;color:#3a2e22;align-items:center;justify-content:center;text-align:center;display:flex;flex-direction:column}.bc1:before,.bc1:after{content:"";position:absolute;border:.3cqw solid var(--c)}.bc1:before{inset:3cqw}.bc1:after{inset:4.4cqw;opacity:.45}
.bc1 .nmz{font:600 6.4cqw var(--serif);letter-spacing:.22em;text-transform:uppercase}.bc1 .tlz{font:italic 4cqw var(--serif);color:var(--c)}.bc1 hr{width:14cqw;border:0;border-top:.3cqw solid var(--c);margin:2.5cqw 0}.bc1 img{width:12cqw;margin-bottom:2cqw}
.bc1b{background:var(--c);color:#fff8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2cqw;font-size:3cqw}.bc1b .qr{width:28cqw;height:28cqw}
.bp{background:#fff;color:#1f2430;display:flex}.bp .l{width:34%;background:var(--c);display:grid;place-items:center}.bp .l img{width:15cqw}.bp .r{flex:1;padding:7cqw;display:flex;flex-direction:column;justify-content:center;font-size:3.1cqw;line-height:1.55}
.bp .nmz{font:800 6cqw/1.1 var(--ui)}.bp .tlz{color:var(--c);font-weight:600;font-size:3.6cqw}.bp .coz{color:#6b7280;margin-bottom:2cqw}.bp .qr{inset-inline-end:5cqw;bottom:5cqw;width:17cqw;height:17cqw;box-shadow:0 0 0 .3cqw #e5e7eb}
.bpb{background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5cqw;font-size:3.6cqw}.bpb .qr{width:34cqw;height:34cqw}
.lgb{position:absolute!important;bottom:3.5cqw;left:50%;translate:-50% 0;width:8cqw;opacity:.65;z-index:3}.pn .lgb,.mc.gr .lgb,.d-modern .lgb{filter:invert(1)}
.tile a,.tile button{pointer-events:none}
.card.dc{aspect-ratio:5/8;padding:0;justify-content:flex-start;font-family:var(--ui);border-radius:6cqw}.dc>*{position:relative;z-index:2}.dc .dbg{position:absolute;inset:0 0 auto 0;height:34cqw;z-index:1}
.dav{width:24cqw;height:24cqw;border-radius:50%;display:grid;place-items:center;margin-top:22cqw;font:700 9cqw var(--disp)}
.dc .dn{font:700 7.4cqw/1.15 var(--disp);margin:4cqw 6cqw 0}.dc .dt2{font-size:4.2cqw;color:var(--c);font-weight:600;margin-top:1.5cqw}.dc .dco{font-size:3.4cqw;opacity:.6;margin-top:1cqw}
.dbs{display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw 2cqw;width:100%;padding:0 5cqw;margin-top:9cqw}
.db{display:flex;flex-direction:column;align-items:center;gap:1.2cqw;color:inherit;text-decoration:none;font-size:2.8cqw;transition:.2s}.db:hover{transform:translateY(-1cqw)}.db span{width:13cqw;height:13cqw;border-radius:50%;display:grid;place-items:center;font-size:5.6cqw}
.dqb{margin-top:9cqw;border:0;border-radius:10cqw;padding:2.8cqw 7cqw;background:var(--c);color:#fff;font:700 3.6cqw var(--ui);cursor:pointer}
.dq{position:absolute!important;inset:0;z-index:6!important;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;background:var(--dqbg,#fff);cursor:pointer;font-size:3.4cqw}.dc.qon .dq{display:flex}.dq .qr{width:50cqw;height:50cqw}
.d-modern{background:#0f1115;color:#fff;--dqbg:#0f1115f2}.d-modern .dbg{inset:0;height:auto;background:radial-gradient(circle at 18% 8%,var(--c),transparent 46%),radial-gradient(circle at 95% 38%,#6c63ff88,transparent 42%);opacity:.6;animation:drift 8s ease-in-out infinite alternate}@keyframes drift{to{transform:scale(1.25) translate(-4%,3%)}}
.d-modern .dav{background:#ffffff14;border:.5cqw solid var(--c)}.d-modern .db span{background:#ffffff1a}
.d-classic{background:#f7f0e1;color:#3a2e22;--dqbg:#f7f0e1}.d-classic:before{content:"";position:absolute;inset:3cqw;border:.3cqw solid var(--c);border-radius:4cqw;z-index:1}.d-classic .dav{margin-top:16cqw;border:.5cqw solid var(--c);color:var(--c);font-family:var(--serif);font-weight:600}.d-classic .dn{font:600 7cqw/1.2 var(--serif);text-transform:uppercase;letter-spacing:.16em}.d-classic .dt2{font:italic 600 4.8cqw var(--serif)}.d-classic .db span{border:.3cqw solid var(--c);color:var(--c)}
.d-pro{background:#fff;color:#1f2430;--dqbg:#fff}.d-pro .dbg{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}.d-pro .dav{background:#fff;color:var(--c);border:1cqw solid #fff;box-shadow:0 2cqw 6cqw #0003}.d-pro .dbs{grid-template-columns:1fr 1fr;gap:2.5cqw}.d-pro .db{flex-direction:row;background:#f4f5f8;border-radius:4cqw;padding:2.5cqw;font-size:3.4cqw;font-weight:600;justify-content:flex-start}.d-pro .db span{width:9cqw;height:9cqw;background:var(--c);font-size:4cqw}
.cs.dcw{width:min(64%,320px)}.cu .cs.dcw{width:min(80%,300px)}
.dm{background:var(--mb);color:var(--mt);border-radius:28px;overflow:clip;box-shadow:0 14px 34px #0003;max-width:520px;margin:0 auto;font-family:var(--ui);text-align:start}
.dmh{padding:34px 22px 22px;text-align:center;background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;text-shadow:0 1px 8px #0004}.dmh .em{font-size:52px;animation:flt 3s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-6px) rotate(-4deg)}}.dmh h1{font:700 30px/1.15 var(--disp);margin:6px 0 2px}.dmh p{margin:0;opacity:.9;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;position:sticky;top:calc(66px + env(safe-area-inset-top,0px));background:var(--mb);z-index:5}.tabs button{border:0;border-radius:30px;padding:8px 16px;white-space:nowrap;background:color-mix(in srgb,var(--mt) 10%,transparent);color:var(--mt);cursor:pointer;font-weight:600;font-size:14px}.tabs button.on{background:var(--c);color:#fff}
.dml{padding:0 16px 8px}.dml h4{font:700 20px var(--disp);margin:16px 4px 6px;color:var(--c)}
.dmi{display:flex;align-items:center;gap:12px;padding:12px;margin:8px 0;border-radius:18px;background:color-mix(in srgb,var(--mt) 6%,transparent);animation:ri .5s both}.dmi .e{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);font-size:20px}.dmi .n{flex:1;font-weight:600;font-size:15px}.dmi b{color:var(--c);white-space:nowrap}.dmi small{font-weight:400;opacity:.7}
.dmf{padding:8px 16px 14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:13px}.dmf .ch,.dmf a{background:color-mix(in srgb,var(--mt) 9%,transparent);padding:7px 12px;border-radius:20px;color:inherit;text-decoration:none;border:0;font:inherit;cursor:pointer}
.dml2{display:block;width:34px;margin:0 auto 22px;opacity:.6}.gr .dml2{filter:invert(1)}
/* menus */
.mc{padding:12cqw 8cqw 16cqw;gap:2.5cqw;background:var(--mb);color:var(--mt)}.mc .em{font-size:24cqw;line-height:1}.mc .nm{text-transform:none;letter-spacing:0;font-size:9cqw;margin:0!important}.mc .pre{font-size:4cqw;font-style:italic}.mc .sc{font-size:5cqw;letter-spacing:.4em;color:var(--c)}
.tm{--mb:#fbf3e6;--mt:#3b2a20}.gr{--mb:#12302a;--mt:#f2e8cf;font-family:'Amiri',var(--serif)}.cfe{--mb:#fff6f0;--mt:#4a3428}
.mn{background:var(--mb);color:var(--mt);padding:30px 24px 26px;border-radius:6px;box-shadow:0 14px 34px #0003;font-family:var(--serif);font-size:17px;text-align:center;outline:1px solid var(--c);outline-offset:-10px;max-width:520px;margin:0 auto}
.gr.mn{font-family:'Amiri',var(--serif)}.cfe.mn{font-family:var(--ui);font-size:15px;outline:0}
.mn h1{font:600 34px/1.15 inherit;margin:6px 0 2px}.cfe.mn h1{font:400 44px var(--script)}.mn .tg{font-style:italic;opacity:.8;margin:0 0 6px}
.mn h4{font:600 22px inherit;color:var(--c);margin:22px 0 6px;letter-spacing:.05em}.mn h4:before,.mn h4:after{content:"✦";font-size:11px;margin:0 10px;opacity:.7}
.it{display:flex;align-items:baseline;gap:8px;text-align:start;margin:9px 0}.it i{flex:1;border-bottom:1px dotted currentColor;opacity:.35;translate:0 -4px}.it b{color:var(--c);font-weight:600}
.mf{margin-top:22px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--mt) 25%,transparent);font-size:14px;display:grid;gap:3px;justify-items:center}.mf .qr{width:96px;height:96px;margin:10px 0 2px}.mf small{opacity:.75}
/* envelope */
.scene{display:flex;flex-direction:column;align-items:center;gap:24px;padding:20px 0}
.env{--w:min(88vw,400px);position:relative;width:var(--w);height:calc(var(--w)*.68);perspective:1200px;cursor:pointer;filter:drop-shadow(0 18px 24px #0003)}.env>div{position:absolute}.back{inset:0;background:var(--env);border-radius:6px}
.letter{left:6%;right:6%;top:6%;height:88%;background:#fffdf8;border-radius:4px;z-index:2;transition:transform 1s .7s;display:grid;place-items:center;font:34px var(--script);color:var(--gold)}
.pocket{inset:0;z-index:3}.pocket b{position:absolute;inset:0;background:var(--pk)}.pocket b:nth-child(1){clip-path:polygon(0 0,52% 53%,0 100%);background:color-mix(in srgb,var(--pk) 88%,#000)}.pocket b:nth-child(2){clip-path:polygon(100% 0,48% 53%,100% 100%);background:color-mix(in srgb,var(--pk) 92%,#000)}.pocket b:nth-child(3){clip-path:polygon(0 100%,50% 40%,100% 100%)}
.flap{left:0;top:0;width:100%;height:58%;z-index:4;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s,z-index 0s .45s}
.names{left:0;right:0;bottom:11%;z-index:5;text-align:center;font:30px/1.2 var(--script);color:var(--ink)}.names s{text-decoration:none;color:var(--gold);margin:0 .2em}
.seal{left:50%;top:58%;translate:-50% -50%;z-index:6;width:68px;height:68px;border:0;background:none;padding:0;cursor:pointer;animation:beat 1.4s infinite;transition:opacity .4s,scale .4s;filter:drop-shadow(0 4px 6px #0005)}.seal svg{width:100%;height:100%}
@keyframes beat{0%,100%{scale:1}20%{scale:1.14}40%{scale:1}}
.env.open .flap{transform:rotateX(180deg);z-index:1}.env.open .seal{opacity:0;scale:1.8;animation:none;pointer-events:none}.env.open .letter{transform:translateY(-55%)}
.hint{font:italic 20px var(--serif);animation:nd 1.6s infinite}@keyframes nd{50%{transform:translateY(5px)}}
.rise{animation:ri 1s cubic-bezier(.2,.8,.2,1) both;width:min(94vw,440px)}@keyframes ri{from{opacity:0;transform:translateY(60px) scale(.85)}}
.petal{position:fixed;top:-30px;width:12px;height:16px;border-radius:70% 0 70% 0;opacity:.6;animation:fall linear infinite;pointer-events:none;z-index:1}@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
.drawer{position:fixed;inset:0;background:var(--bg);z-index:60;padding:90px 28px;display:none;flex-direction:column;gap:18px;font:28px var(--serif)}.drawer.on{display:flex}.drawer a{cursor:pointer}
.mod{position:fixed;inset:0;background:#000a;z-index:80;display:grid;place-items:center;padding:20px}.mod div{background:#fff;color:#111;border-radius:22px;padding:24px;text-align:center;max-width:340px;width:100%}.mod .qr{width:240px;height:240px;margin:0 auto 12px;box-shadow:none}.mod small{display:block;color:#666;word-break:break-all;margin-bottom:14px;max-height:48px;overflow:hidden}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;background:#222;color:#fff;padding:10px 20px;border-radius:30px;z-index:90}
button:focus-visible,.tile:focus-visible,.sw i:focus-visible{outline:3px solid var(--gr);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.petal{display:none}}
.two.b .full{grid-column:1/-1}.btn svg,.dlb svg{width:20px;height:20px;vertical-align:-4px;margin-inline-end:6px}
.ibr{position:absolute!important;bottom:3.4cqw;left:50%;translate:-50% 0;display:flex;gap:2.4cqw;z-index:5!important}
.ia{width:9cqw;height:9cqw;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;color:inherit;background:color-mix(in srgb,currentColor 14%,transparent);box-shadow:inset 0 0 0 .3cqw color-mix(in srgb,currentColor 24%,transparent);text-decoration:none;transition:.2s}.ia:hover{transform:translateY(-.8cqw)}.ia svg{width:4.8cqw;height:4.8cqw}.ia.w{background:#25D366;color:#fff;box-shadow:none}
.ibr~.lgb{left:auto;right:5cqw;translate:none;bottom:5.4cqw}
.db{background:none;border:0;padding:0;cursor:pointer;font-family:inherit}.db svg{width:5.8cqw;height:5.8cqw}.db.w span{background:#25D366!important;color:#fff;border-color:#25D366!important}
.dma{display:flex;gap:8px;padding:14px 16px 2px}.dma a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 6px;border-radius:16px;background:color-mix(in srgb,var(--mt) 9%,transparent);color:inherit;text-decoration:none;font-weight:600;font-size:14px}.dma svg{width:19px;height:19px;flex:none}.dma a.w{background:#25D366;color:#fff}
.dmi .n{display:flex;flex-direction:column}.dmi .n b{font-size:13px;margin-top:2px}
.qt{display:flex;align-items:center;gap:6px}.qt button{width:32px;height:32px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}.qt button.m{background:color-mix(in srgb,var(--mt) 16%,transparent);color:var(--mt)}.qt i{font-style:normal;font-weight:700;min-width:18px;text-align:center}
.dmo{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;margin:6px 16px 16px;padding:13px 18px;border-radius:40px;background:#25D366;color:#fff;text-decoration:none;font-weight:700;box-shadow:0 8px 20px #0004;z-index:6}.dmo span{flex:1}.dmo svg{width:22px;height:22px}.dmo b{color:#fff;white-space:nowrap}
.dmf .ch,.dmf a{display:inline-flex;align-items:center;gap:6px}.dmf svg{width:15px;height:15px;flex:none}
.fm small{display:block;color:var(--mut);margin-top:4px;font-size:13px}
.mod .sh{max-height:88vh;overflow:auto}.dlb{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin:8px 0;border:0;border-radius:14px;background:#f2f3f5;color:#111;cursor:pointer;text-align:start}.dlb .di{width:40px;height:40px;border-radius:50%;background:var(--gr);color:#fff;display:grid;place-items:center;flex:none}.dlb .di svg{margin:0}.dlb .dt3{display:flex;flex-direction:column}.dlb small{margin:0!important;color:#666!important;max-height:none!important}
.viewer header,.viewer .bk,.viewer .bc,.viewer .drawer,.viewer .two.b{display:none!important}
.cs{grid-template-columns:minmax(0,1fr)}.dm{width:100%;min-width:0}
.dmo{line-height:1.2}.dmo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
